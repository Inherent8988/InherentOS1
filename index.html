<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><title>InherentOS</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d171c">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png"></head>
<body>
<div id="desktop"></div>
<div id="windows"></div>
<div id="start" class="hidden">
  <button data-app="explorer">📁 Проводник</button>
  <button data-app="notepad">📝 Блокнот</button>
  <button data-app="word">📘 Word</button>
  <button data-app="excel">📗 Excel</button>
  <button data-app="ppt">📙 PowerPoint</button>
  <button data-app="paint">🎨 Paint</button>
  <button data-app="reset">♻️ Сбросить систему</button>
</div>
<div id="taskbar">
  <button id="startbtn">⊞ Пуск</button>
  <div id="tasks"></div>
  <div id="clock"></div>
</div>
<script src="js/zip.js"></script>
<script src="js/fs.js"></script>
<script src="js/apps.js"></script>
<script src="js/apps2.js"></script>
<script src="js/apps3.js"></script>
<script src="js/apps4.js"></script>
<script src="js/apps5.js"></script>
<script src="js/os.js"></script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
</body></html>
